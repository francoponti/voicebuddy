<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatterbox TTS Studio</title>
    <link rel="stylesheet" href="/static/styles.css?v=4" />
  </head>
  <body>
    <main class="page-shell">
      <section class="panel">
        <h1>Chatterbox TTS Studio</h1>
        <p class="subtitle">Paste text, choose an American English voice, and download polished audio locally.</p>

        <label class="field">
          <span>Text to speak</span>
          <textarea id="text-input" placeholder="Type or paste your script here..."></textarea>
        </label>

        <label class="field">
          <span>Reference audio <em>(optional)</em></span>
          <input id="reference-audio" type="file" accept="audio/*" />
          <small class="hint">Upload a short clip to guide the voice style.</small>
        </label>

        <div class="controls-grid">
          <label class="field">
            <span>Voice</span>
            <select id="voice-select"></select>
          </label>

          <label class="field">
            <span>Preset</span>
            <select id="preset-select">
              <option value="neutral">Neutral</option>
              <option value="warm">Warm</option>
              <option value="dramatic">Dramatic</option>
              <option value="energetic">Energetic</option>
            </select>
          </label>

          <label class="field">
            <span>Rate: <strong id="rate-value">150</strong></span>
            <input id="rate-slider" type="range" min="80" max="250" value="150" />
          </label>

          <label class="field">
            <span>Pitch: <strong id="pitch-value">1.0</strong> <em>(unsupported on this Mac engine)</em></span>
            <input id="pitch-slider" type="range" min="0.5" max="2.0" step="0.1" value="1.0" disabled />
          </label>

          <label class="field">
            <span>Volume: <strong id="volume-value">1.0</strong></span>
            <input id="volume-slider" type="range" min="0.1" max="1.0" step="0.1" value="1.0" />
          </label>

          <label class="field">
            <span>Exaggeration: <strong id="exaggeration-value">0.5</strong></span>
            <input id="exaggeration-slider" type="range" min="0.0" max="1.0" step="0.1" value="0.5" />
          </label>
        </div>

        <div class="actions">
          <button id="generate-btn">Generate Audio</button>
          <button id="play-btn" class="secondary" disabled>Play</button>
          <button id="download-btn" class="secondary" disabled>Download</button>
        </div>

        <div id="progress-wrapper" class="progress-wrapper" hidden>
          <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <p id="progress-label" class="progress-label">0%</p>

        <p id="status" class="status">Ready.</p>
        <audio id="audio-player" controls hidden></audio>
      </section>
    </main>

    <script src="/static/app.js?v=4"></script>
  </body>
</html>
